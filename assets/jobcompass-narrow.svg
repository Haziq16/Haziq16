a · Better Auth</text><g transform="translate(78 316)"><rect width="282" height="260" rx="14" fill="#111114" stroke="#303036"/><text x="18" y="29" font-size="10" fill="#38e062" letter-spacing="1.4">EVIDENCE, NOT GUESSES</text><rect x="22" y="48" width="238" height="125" rx="10" fill="#0d2115"/><g class="tile" style="animation-delay:0.0s"><rect x="34" y="60" width="22" height="22" rx="5" fill="#1f3a28"/><rect x="66" y="63" width="104" height="7" rx="3.5" fill="#d4d4d8"/><rect x="66" y="75" width="66" height="5" rx="2.5" fill="#71717a"/><rect x="184" y="63" width="62" height="17" rx="8.5" fill="#27272a" stroke="#3f3f46"/><text x="215" y="75.5" font-size="10" fill="#d4d4d8" text-anchor="middle">Saved</text></g><g class="tile" style="animation-delay:0.6s"><rect x="34" y="96" width="22" height="22" rx="5" fill="#1f3a28"/><rect x="66" y="99" width="104" height="7" rx="3.5" fill="#d4d4d8"/><rect x="66" y="111" width="66" height="5" rx="2.5" fill="#71717a"/><rect x="184" y="99" width="62" height="17" rx="8.5" fill="#27272a" stroke="#3f3f46"/><text x="215" y="111.5" font-size="10" fill="#d4d4d8" text-anchor="middle">Review</text></g><g class="tile" style="animation-delay:1.2s"><rect x="34" y="132" width="22" height="22" rx="5" fill="#1f3a28"/><rect x="66" y="135" width="104" height="7" rx="3.5" fill="#d4d4d8"/><rect x="66" y="147" width="66" height="5" rx="2.5" fill="#71717a"/><rect x="184" y="135" width="62" height="17" rx="8.5" fill="#38e062" stroke="#3f3f46"/><text x="215" y="147.5" font-size="10" fill="#09090b" text-anchor="middle">Applied</text></g><g class="travel"><text x="141" y="203" font-size="21" fill="#fafafa" font-weight="700" letter-spacing="3" text-anchor="middle">YOU APPLY</text></g><text x="141" y="231" font-size="13" fill="#a1a1aa" text-anchor="middle">Discover · Review · Track</text></g></svg>