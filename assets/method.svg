<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Six steps: understand, plan, build, connect, verify and refine."><title>Six steps: understand, plan, build, connect, verify and refine.</title><style>text{font-family:Georgia,'Times New Roman',serif}.pulse{animation:pulse 3s ease-in-out infinite}.tile{animation:tile 6s ease-in-out infinite}.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 6s ease-in-out infinite}.travel{animation:travel 6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes tile{0%,100%{opacity:.55}45%{opacity:1}}@keyframes draw{15%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}@keyframes travel{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}</style><rect x="1" y="1" width="878" height="298" rx="15" fill="#09090b" stroke="#27272a"/><text x="24" y="35" font-size="12" fill="#38e062" letter-spacing="1.8">FROM AN IDEA TO A WORKING APP</text><rect x="24" y="58" width="264" height="104" rx="10" fill="#111114" stroke="#27272a"/><text x="40" y="85" font-size="13" fill="#38e062" >01</text><text x="72" y="87" font-size="21" fill="#fafafa" font-weight="700">Understand</text><text x="40" y="114" font-size="13" fill="#a1a1aa" >Define the user and the task.</text><rect x="308" y="58" width="264" height="104" rx="10" fill="#111114" stroke="#27272a"/><text x="324" y="85" font-size="13" fill="#38e062" >02</text><text x="356" y="87" font-size="21" fill="#fafafa" font-weight="700">Plan</text><text x="324" y="114" font-size="13" fill="#a1a1aa" >Break the work into small parts.</text><rect x="592" y="58" width="264" height="104" rx="10" fill="#111114" stroke="#27272a"/><text x="608" y="85" font-size="13" fill="#38e062" >03</text><text x="640" y="87" font-size="21" fill="#fafafa" font-weight="700">Build</text><text x="608" y="114" font-size="13" fill="#a1a1aa" >Implement one complete flow.</text><rect x="24" y="176" width="264" height="104" rx="10" fill="#111114" stroke="#27272a"/><text x="40" y="203" font-size="13" fill="#38e062" >04</text><text x="72" y="205" font-size="21" fill="#fafafa" font-weight="700">Connect</text><text x="40" y="232" font-size="13" fill="#a1a1aa" >Wire data, devices and APIs.</text><rect x="308" y="176" width="264" height="104" rx="10" fill="#111114" stroke="#27272a"/><text x="324" y="203" font-size="13" fill="#38e062" >05</text><text x="356" y="205" font-size="21" fill="#fafafa" font-weight="700">Verify</text><text x="324" y="232" font-size="13" fill="#a1a1aa" >Check behavior and edge cases.</text><rect x="592" y="176" width="264" height="104" rx="10" fill="#111114" stroke="#27272a"/><text x="608" y="203" font-size="13" fill="#38e062" >06</text><text x="640" y="205" font-size="21" fill="#fafafa" font-weight="700">Refine</text><text x="608" y="232" font-size="13" fill="#a1a1aa" >Improve usability and performance.</text></svg>

