rect x="211" y="192.0" width="2" height="12" rx="1" fill="#809eac" class="pulse" style="animation-delay:-1.5s" /><rect x="216" y="189.5" width="2" height="17" rx="1" fill="#809eac" class="pulse" style="animation-delay:-3.0s" /><rect x="221" y="193.0" width="2" height="10" rx="1" fill="#809eac" class="pulse" style="animation-delay:-4.5s" /><rect x="226" y="195.0" width="2" height="6" rx="1" fill="#809eac" class="pulse" style="animation-delay:-6.0s" /></g></svg>
