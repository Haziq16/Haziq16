<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" width="440" height="600" role="img" aria-label="Six steps: understand, plan, build, connect, verify and refine."><title>Six steps: understand, plan, build, connect, verify and refine.</title><style>text{font-family:Georgia,'Times New Roman',serif}
.pulse{animation:breathe 8s ease-in-out infinite}.tile{animation:presence 10s ease-in-out infinite}
.travel{animation:float 9s ease-in-out infinite}.contour{stroke-dasharray:95 420;animation:contour 18s linear infinite}
.step{animation:step 18s ease-in-out infinite}.glint{animation:glint 12s ease-in-out infinite}
.arrow{animation:arrow 8s ease-in-out infinite}.mist{animation:mist 22s ease-in-out infinite}
.star{animation:star 11s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes presence{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes contour{to{stroke-dashoffset:-515}}
@keyframes step{0%,17%,100%{stroke:#26353f}7%,12%{stroke:#b49a78}}
@keyframes glint{0%,100%{opacity:.15}50%{opacity:.5}}
@keyframes arrow{0%,70%,100%{transform:translate(0,0)}80%,90%{transform:translate(2px,-2px)}}
@keyframes mist{0%,100%{transform:translateX(0);opacity:.25}50%{transform:translateX(14px);opacity:.5}}
@keyframes star{0%,100%{opacity:.2}50%{opacity:.65}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.contour{stroke-dasharray:none}.travel,.arrow,.mist{transform:none}.pulse,.tile{opacity:1}}
</style><rect x="1" y="1" width="438" height="598" rx="15" fill="#0a1118" stroke="#26353f" /><text x="24" y="35" font-size="12" fill="#b49a78" letter-spacing="1.8">FROM AN IDEA TO A WORKING APP</text><rect x="24" y="58" width="392" height="76" rx="10" fill="#101b24" stroke="#26353f" class="step" style="animation-delay:-18s" /><text x="40" y="85" font-size="13" fill="#b49a78">01</text><text x="72" y="87" font-size="21" fill="#ece5d8" font-weight="700">Understand</text><text x="40" y="114" font-size="15" fill="#a6b3bc">Define the user and the task.</text><rect x="24" y="148" width="392" height="76" rx="10" fill="#101b24" stroke="#26353f" class="step" style="animation-delay:-15s" /><text x="40" y="175" font-size="13" fill="#b49a78">02</text><text x="72" y="177" font-size="21" fill="#ece5d8" font-weight="700">Plan</text><text x="40" y="204" font-size="15" fill="#a6b3bc">Break the work into small parts.</text><rect x="24" y="238" width="392" height="76" rx="10" fill="#101b24" stroke="#26353f" class="step" style="animation-delay:-12s" /><text x="40" y="265" font-size="13" fill="#b49a78">03</text><text x="72" y="267" font-size="21" fill="#ece5d8" font-weight="700">Build</text><text x="40" y="294" font-size="15" fill="#a6b3bc">Implement one complete flow.</text><rect x="24" y="328" width="392" height="76" rx="10" fill="#101b24" stroke="#26353f" class="step" style="animation-delay:-9s" /><text x="40" y="355" font-size="13" fill="#b49a78">04</text><text x="72" y="357" font-size="21" fill="#ece5d8" font-weight="700">Connect</text><text x="40" y="384" font-size="15" fill="#a6b3bc">Wire data, devices and APIs.</text><rect x="24" y="418" width="392" height="76" rx="10" fill="#101b24" stroke="#26353f" class="step" style="animation-delay:-6s" /><text x="40" y="445" font-size="13" fill="#b49a78">05</text><text x="72" y="447" font-size="21" fill="#ece5d8" font-weight="700">Verify</text><text x="40" y="474" font-size="15" fill="#a6b3bc">Check behavior and edge cases.</text><rect x="24" y="508" width="392" height="76" rx="10" fill="#101b24" stroke="#26353f" class="step" style="animation-delay:-3s" /><text x="40" y="535" font-size="13" fill="#b49a78">06</text><text x="72" y="537" font-size="21" fill="#ece5d8" font-weight="700">Refine</text><text x="40" y="564" font-size="15" fill="#a6b3bc">Improve usability and performance.</text><circle cx="402.0" cy="72.0" r="2" fill="#b49a78" opacity=".5" class="star" style="animation-delay:-0s" /><circle cx="402.0" cy="162.0" r="2" fill="#b49a78" opacity=".5" class="star" style="animation-delay:-3s" /><circle cx="402.0" cy="252.0" r="2" fill="#b49a78" opacity=".5" class="star" style="animation-delay:-6s" /><circle cx="402.0" cy="342.0" r="2" fill="#b49a78" opacity=".5" class="star" style="animation-delay:-9s" /><circle cx="402.0" cy="432.0" r="2" fill="#b49a78" opacity=".5" class="star" style="animation-delay:-12s" /><circle cx="402.0" cy="522.0" r="2" fill="#b49a78" opacity=".5" class="star" style="animation-delay:-15s" /></svg>
