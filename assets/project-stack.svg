<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img" aria-label="Tools used across Toddler English, NavigateMe and MyHealth."><title>Tools used across Toddler English, NavigateMe and MyHealth.</title><style>text{font-family:Georgia,'Times New Roman',serif}
.pulse{animation:breathe 8s ease-in-out infinite}.tile{animation:presence 10s ease-in-out infinite}
.travel{animation:float 9s ease-in-out infinite}.contour{stroke-dasharray:95 420;animation:contour 18s linear infinite}
.step{animation:step 18s ease-in-out infinite}.glint{animation:glint 12s ease-in-out infinite}
.arrow{animation:arrow 8s ease-in-out infinite}.mist{animation:mist 22s ease-in-out infinite}
.star{animation:star 11s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes presence{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes contour{to{stroke-dashoffset:-515}}
@keyframes step{0%,17%,100%{stroke:#26353f}7%,12%{stroke:#b49a78}}
@keyframes glint{0%,100%{opacity:.15}50%{opacity:.5}}
@keyframes arrow{0%,70%,100%{transform:translate(0,0)}80%,90%{transform:translate(2px,-2px)}}
@keyframes mist{0%,100%{transform:translateX(0);opacity:.25}50%{transform:translateX(14px);opacity:.5}}
@keyframes star{0%,100%{opacity:.2}50%{opacity:.65}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.contour{stroke-dasharray:none}.travel,.arrow,.mist{transform:none}.pulse,.tile{opacity:1}}
</style><rect x="1" y="1" width="878" height="410" rx="15" fill="#0a1118" stroke="#26353f" /><text x="24" y="37" font-size="12" fill="#b49a78" letter-spacing="1.5">TOOLS IN MY PROJECTS</text><text x="460" y="77" font-size="16" fill="#c8d0d3" text-anchor="middle">Toddler English</text><text x="580" y="77" font-size="16" fill="#c8d0d3" text-anchor="middle">NavigateMe</text><text x="700" y="77" font-size="16" fill="#c8d0d3" text-anchor="middle">MyHealth</text><text x="24" y="117" font-size="18" fill="#a6b3bc">Kotlin</text><rect x="453" y="103" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-3s" /><rect x="573" y="103" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-6s" /><rect x="693" y="103" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-9s" /><text x="24" y="157" font-size="18" fill="#a6b3bc">Jetpack Compose</text><rect x="453" y="143" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-12s" /><rect x="573" y="143" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-15s" /><rect x="693" y="143" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-0s" /><text x="24" y="197" font-size="18" fill="#a6b3bc">Room</text><rect x="453" y="183" width="16" height="16" rx="4" fill="#17232c" /><rect x="573" y="183" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-6s" /><rect x="693" y="183" width="16" height="16" rx="4" fill="#17232c" /><text x="24" y="237" font-size="18" fill="#a6b3bc">Firebase</text><rect x="453" y="223" width="16" height="16" rx="4" fill="#17232c" /><rect x="573" y="223" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-15s" /><rect x="693" y="223" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-0s" /><text x="24" y="277" font-size="18" fill="#a6b3bc">Bundled audio</text><rect x="453" y="263" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-3s" /><rect x="573" y="263" width="16" height="16" rx="4" fill="#17232c" /><rect x="693" y="263" width="16" height="16" rx="4" fill="#17232c" /><text x="24" y="317" font-size="18" fill="#a6b3bc">Maps &amp; sensors</text><rect x="453" y="303" width="16" height="16" rx="4" fill="#17232c" /><rect x="573" y="303" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-15s" /><rect x="693" y="303" width="16" height="16" rx="4" fill="#17232c" /><text x="24" y="357" font-size="18" fill="#a6b3bc">Gemini / ML Kit</text><rect x="453" y="343" width="16" height="16" rx="4" fill="#17232c" /><rect x="573" y="343" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-6s" /><rect x="693" y="343" width="16" height="16" rx="4" fill="#809eac" class="step" stroke="#26353f" style="animation-delay:-9s" /></svg>
